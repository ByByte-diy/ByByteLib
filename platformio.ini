; Root PlatformIO config to build examples without modifying library sources

[platformio]
src_dir = examples/platformio_basic/src

[env]
lib_ldf_mode = chain+
build_flags = -Isrc
lib_extra_dirs = .

[env:nano]
platform = atmelavr
framework = arduino
board = nanoatmega328
monitor_speed = 115200

; Optional: uncomment to build for Nano ATmega168
; [env:nano168]
; platform = atmelavr
; framework = arduino
; board = nanoatmega168
; monitor_speed = 115200

[env:mega]
platform = atmelavr
framework = arduino
board = megaatmega2560
monitor_speed = 115200

