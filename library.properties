sentence=Cross-platform robotics control library for Arduino-compatible boards.
paragraph=Modular single-install library: motors (DRV8833/TB6612), buzzer, sensors (battery/LDR/LM35/side-IR), Bluetooth (HC-02/05/06/08/42), IR remote receiver, hobby servo, ultrasonic sonar. Platform auto-detection and per-board pin defaults. Include a per-module header (e.g. <MotorDriver.h>) or the aggregate <ByByteLib.h>.
