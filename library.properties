name=ByByteLib
version=1.0.0-alpha
author=ByByte Team
maintainer=ByByte Team <vergilium2@gmail.com>
sentence=Arduino-compatible robotics control library for AVR-based robots and kits.
paragraph=Modular single-install library for motors (DRV8833/TB6612), buzzer, sensors (battery/LDR/LM35/side-IR), Bluetooth (HC-02/05/06/08/42), IR remote receiver, hobby servo, ultrasonic sonar, and kit abstractions. Includes auto-detection for Nano/Mega and board-specific pin defaults. Use the aggregate <ByByteLib.h> or individual headers such as <MotorDriver.h> and <Sonar.h>.
category=Device Control
