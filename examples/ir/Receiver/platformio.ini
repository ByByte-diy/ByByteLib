; ByByteLib - IR Receiver Diagnostic (Nano / Mega)
; -------------------------------------------------
; Standalone IR receive test using the Arduino-IRremote library directly
; (the `IrReceiver` instance + `decode()` / `resume()` API). It is deliberately
; independent of ByByteLib's modules and PcintManager so it serves as a clean
; reference that confirms your IR receiver hardware + remote are seen by
; IRremote, and prints the decoded protocol/address/command + the raw timing
; buffer so you can read your remote's exact codes.
;
; IMPORTANT (AVR): IRremote's IrReceiver uses Timer2 for receive timing. Do NOT
; run the buzzer (tone()) in this same sketch — tone() also owns Timer2 and
; they conflict. The buzzer is not used here, so this sketch is conflict-free.
;
; Build: pio run -e nano  |  pio run -e mega

[platformio]
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
; The example lives inside the ByByteLib tree for discoverability, but it does
; NOT depend on ByByteLib itself — only on Arduino-IRremote.
lib_extra_dirs = ../../..
lib_deps =
	arminjo/IRremote @ ^4.4.1

[env:nano]
platform = atmelavr
board = nanoatmega328

[env:mega]
platform = atmelavr
board = megaatmega2560