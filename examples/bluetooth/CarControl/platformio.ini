; Build from this directory: pio run -e nano   or   pio run -e mega
; Library sources: repo root (three levels up).

[platformio]
src_dir = .

[env]
framework = arduino
lib_ldf_mode = chain+
build_flags = -Isrc
lib_extra_dirs = ../../..
lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.0
monitor_speed = 115200

[env:nano]
platform = atmelavr
board = nanoatmega328

[env:mega]
platform = atmelavr
board = megaatmega2560
