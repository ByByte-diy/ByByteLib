; Single-install ByByteLib example. Depends on the ByByteLib library
; (discovered from the repo root via lib_extra_dirs) plus any external
; libs. Build: pio run -e nano   or   pio run -e mega

[platformio]
src_dir = .

[env]
framework = arduino
lib_ldf_mode = chain+
lib_extra_dirs = ../../..
lib_deps =
	ByByteLib
monitor_speed = 115200

[env:nano]
platform = atmelavr
board = nanoatmega328
lib_deps =
	${env.lib_deps}
	slashdevin/NeoSWSerial
build_flags =
	-DNEOSWSERIAL_EXTERNAL_PCINT
[env:mega]
platform = atmelavr
board = megaatmega2560
