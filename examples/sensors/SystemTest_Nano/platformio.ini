; Single-install ByByteLib example. Depends on the ByByteLib library
; (discovered from the repo root via lib_extra_dirs) plus Adafruit NeoPixel
; and Arduino-IRremote (for the 'j' IR receive-test command).
; Build: pio run -e nano
;
; NOTE: IRremote's IrReceiver and the buzzer (tone()) both use Timer2 on AVR.
; The sketch does not start IR at boot; it only takes Timer2 for IR while the
; 'j' IR-test mode is active (buzzer silenced first) and releases it on exit.

[platformio]
src_dir = .

[env]
framework = arduino
lib_ldf_mode = chain+
lib_extra_dirs = ../../..
lib_deps =
	ByByteLib
	adafruit/Adafruit NeoPixel @ ^1.12.0
	arminjo/IRremote @ ^4.4.1
monitor_speed = 115200

; ---- Conflict-free shared PCINT architecture (Nano) -------------------------
; PcintManager is the single owner of the PCINT0/1/2 vectors. NeoSWSerial
; (Bluetooth) is compiled with NEOSWSERIAL_EXTERNAL_PCINT so it emits NO ISR and
; instead receives byte edges via PcintManager's per-group port hook.
; NeoSWSerial at 16 MHz borrows Timer0's free-running counter (no Timer2 action),
; so it never conflicts with the buzzer's tone() (Timer2) or the D9/D10 motor PWM.
; Result: Bluetooth + motors + buzzer all coexist with no vector/timer clashes.

[env:nano]
platform = atmelavr
board = nanoatmega328
lib_deps =
	${env.lib_deps}
	slashdevin/NeoSWSerial
build_flags =
	-DNEOSWSERIAL_EXTERNAL_PCINT